<title>KUNTUR NEST</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#14284b;--ink:#1f3350;--mut:#6d7e94;--line:#e6edf3;--bg:#f5f8fb;--g:#2f9e6e}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}.w{max-width:1180px;margin:0 auto;padding:0 20px}
.hero{position:relative;color:#fff;background:linear-gradient(160deg,#14284b 0%,#1d4a7a 45%,#2a8f9a 80%,#f0b25e 130%);overflow:hidden;padding-bottom:90px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.5px}
.logo i{width:40px;height:40px;border-radius:13px;background:#f6c05f;color:var(--navy);display:grid;place-items:center;font-style:normal;font-size:22px}
.pill{background:#ffffff22;border:1px solid #ffffff33;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;backdrop-filter:blur(6px)}
.hero h1{font-size:clamp(30px,5.2vw,54px);line-height:1.08;letter-spacing:-1.8px;margin:34px 0 14px;font-weight:800;max-width:720px}
.hero h1 em{font-style:normal;color:#ffd886}.hero p{max-width:540px;color:#d6e6f3;margin:0 0 26px;font-size:16px}
.sbox{display:flex;align-items:center;gap:10px;background:#fff;color:var(--ink);border-radius:16px;padding:6px 8px 6px 18px;max-width:600px;box-shadow:0 18px 40px #0a1a3a55}
.sbox input{flex:1;border:0;outline:0;font:inherit;padding:11px 0;min-width:0;background:none}
.sbox span{font-size:20px;color:#7b93a9}
.mt{position:absolute;left:0;right:0;bottom:-1px;height:90px;width:100%}
.start{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font-size:13px;color:#e8f3fb}
.start b{background:#ffffff1f;padding:3px 10px;border-radius:99px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:6px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none;flex:1}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font:600 13px Poppins,sans-serif;color:var(--ink);cursor:pointer;transition:.15s}
.chip:hover{transform:translateY(-1px);box-shadow:0 6px 14px #1b355214}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font:600 13px Poppins,sans-serif;color:var(--ink)}
.count{color:var(--mut);font-size:13px;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:20px;padding-bottom:50px}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.2s;box-shadow:0 6px 18px #1b35520c;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 38px #1b355224}
.top{height:116px;display:grid;place-items:center;font-size:52px;position:relative}
.dist{position:absolute;left:12px;bottom:10px;background:#ffffffe6;color:var(--ink);font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.cb small{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.cb h3{margin:0;font-size:16.5px;line-height:1.25;letter-spacing:-.3px}
.cb p{margin:0;color:var(--mut);font-size:13px;flex:1}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.pr{font-weight:800;color:#1c7a52;background:#e6f6ee;padding:4px 11px;border-radius:99px;font-size:13px}
.go{font-size:12px;font-weight:700;color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;padding:50px;background:#fff;border:1px dashed #c9d7e2;border-radius:20px;color:var(--mut)}
footer{background:var(--navy);color:#9db4cc;text-align:center;padding:28px 20px;font-size:13px}
footer small{display:block;max-width:620px;margin:8px auto 0;opacity:.8}
.md{position:fixed;inset:0;z-index:50;background:#0c1b3299;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sh{background:#fff;border-radius:26px;width:min(620px,100%);max-height:92vh;overflow:auto;position:relative;animation:up .28s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:#ffffffee;font-size:24px;cursor:pointer;z-index:2}
.mh{height:150px;display:grid;place-items:center;font-size:70px}.mb{padding:22px 26px 26px}
.mb small{font-weight:700;letter-spacing:.9px;text-transform:uppercase;font-size:11px}
.mb h2{margin:4px 0 8px;font-size:26px;letter-spacing:-.8px;line-height:1.15}.mb h4{margin:20px 0 8px;font-size:14px}
.mb p{margin:0;color:#52657b}.mb ul{margin:0;padding-left:20px;color:#52657b}.mb li{margin:3px 0}
.bud{background:#f0f9f4;border:1px solid #d3ece0;border-radius:16px;padding:14px 18px;margin-top:20px}
.bt{display:flex;justify-content:space-between;align-items:center;font-weight:800}.bt b{font-size:22px;color:#1c7a52}
.it{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #d3ece0;padding:8px 0;font-size:13px;margin-top:8px}
.tip{background:#fff6e3;border-left:4px solid #f0a33e;border-radius:10px;padding:11px 14px;font-size:13px;margin:16px 0}
.ac{display:flex;gap:9px;flex-wrap:wrap}.bn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 16px;font:700 13px Poppins,sans-serif;cursor:pointer;color:var(--ink)}
.bn.p{background:var(--navy);color:#fff;border-color:var(--navy)}.bn:hover{filter:brightness(1.08)}
@media(max-width:600px){.md{place-items:end center;padding:0}.sh{border-radius:26px 26px 0 0}.pill{display:none}.hero{padding-bottom:70px}}
.logo img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 4px 14px #0004}
.logo b{letter-spacing:1.5px;font-size:19px}
.rt{display:flex;align-items:center;gap:10px;position:relative}
.um{display:flex;align-items:center;gap:8px;background:#ffffff22;border:1px solid #ffffff44;color:#fff;border-radius:99px;padding:5px 12px 5px 5px;font:600 13px Poppins,sans-serif;cursor:pointer}
.um i{width:30px;height:30px;border-radius:50%;background:#f6c05f;color:var(--navy);display:grid;place-items:center;font-style:normal}
.umm{position:absolute;top:50px;right:0;z-index:20;width:248px;background:#fff;color:var(--ink);border-radius:18px;box-shadow:0 18px 44px #0a1a3a66;padding:8px;animation:up .2s ease}
.umm .hd{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.umm .hd small{display:block;color:var(--mut);font-size:12px}
.umm button.mi{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;font:500 14px Poppins,sans-serif;color:var(--ink);cursor:pointer}
.umm button.mi:hover{background:var(--bg)}
.lg{padding:8px 12px;border-top:1px solid var(--line);margin-top:6px;font-size:12px;color:var(--mut);font-weight:600}
.lg div{display:flex;gap:6px;margin-top:6px}.lg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font:600 13px Poppins,sans-serif;cursor:pointer;color:var(--ink)}
.lg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.brow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 8px;font-weight:600;font-size:13px}
.plan{background:#fff;border:1px solid #d3ece0;border-left:4px solid var(--g);border-radius:14px;padding:12px 16px;font-size:13.5px;margin:6px 0 10px}
.plan a{font-weight:700;color:var(--navy);cursor:pointer;border-bottom:1px dashed var(--mut)}
.fit{position:absolute;right:12px;top:10px;background:var(--g);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px}
.mb .wh{background:#f5f8fb;border-radius:14px;padding:12px 16px;margin-top:14px;color:#3d5069}
.locb{border:1px solid #ffffff55;background:#ffffff22;color:#fff;border-radius:99px;padding:5px 13px;font:600 12px Poppins,sans-serif;cursor:pointer}.locb:hover{background:#ffffff40}
.it b{white-space:nowrap}.locs{margin-top:8px;font-size:12.5px;color:#ffe3a6}.tm{font-size:12px;font-weight:700;color:#1c7a52}
@media(max-width:600px){.um span{display:none}.um{padding:5px}.logo b{font-size:16px}}

/* ===== Responsive ===== */
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
.card:active{transform:scale(.985)}
@media(hover:none){.card:hover,.chip:hover{transform:none;box-shadow:0 6px 18px #1b35520c}}
@media(min-width:1100px){.hero h1{font-size:58px}.grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}.top{height:128px}}
@media(max-width:800px){.w{padding:0 16px}.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}}
@media(max-width:600px){
 .nav{padding:12px 0}.logo{gap:9px}.logo img{width:38px;height:38px}.logo b{font-size:15px;letter-spacing:1px}
 .um{padding:4px}.um i{width:36px;height:36px}.umm{position:fixed;top:62px;right:12px;left:12px;width:auto}
 .umm button.mi{padding:13px 12px;font-size:15px}.lg button{padding:12px}
 .hero{padding-bottom:64px}.hero h1{margin:18px 0 10px;letter-spacing:-1.2px;font-size:clamp(27px,8.4vw,36px)}
 .hero p{font-size:14.5px;margin-bottom:18px}
 .sbox{border-radius:14px;padding:3px 6px 3px 14px}.sbox input,select{font-size:16px}
 .start{flex-wrap:wrap;gap:6px 8px;font-size:12.5px}.locb{padding:9px 14px;font-size:13px}.locs{font-size:12px}
 .bar{flex-direction:column;align-items:stretch;gap:2px}
 .chips{flex:none;min-width:0;width:calc(100% + 32px);margin:0 -16px;padding:8px 16px 10px;scroll-snap-type:x proximity}.chip{padding:11px 16px;scroll-snap-align:start}
 .bar select,.brow select{width:100%;padding:12px}
 .brow{flex-direction:column;align-items:stretch;gap:6px}
 .plan{font-size:13px;padding:11px 14px;line-height:1.7}
 .grid{grid-template-columns:1fr;gap:14px;padding-bottom:36px}
 .top{height:84px;font-size:40px}.cb{padding:13px 15px 15px}.cb h3{font-size:16px}
 .pr{font-size:14px}
 .md{place-items:end center;padding:0}.sh{max-height:94dvh;border-radius:24px 24px 0 0;width:100%}
 .mh{height:104px;font-size:56px}.x{width:44px;height:44px;top:12px;right:12px}
 .mb{padding:18px 18px calc(22px + env(safe-area-inset-bottom))}.mb h2{font-size:22px}
 .bt b{font-size:20px}.it{font-size:12.5px}
 .ac{flex-direction:column}.ac .bn{width:100%;text-align:center;padding:14px 16px;font-size:14px}
 footer{padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
}
@media(max-width:360px){.logo b{font-size:13px}.hero h1{font-size:25px}}

@media(max-width:600px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .card{border-radius:16px}.top{height:74px;font-size:34px}
 .dist{left:8px;bottom:6px;font-size:9.5px;padding:2px 8px}.fit{right:6px;top:6px;font-size:9px;padding:2px 7px}
 .cb{padding:10px 11px 12px;gap:3px}.cb small{font-size:9.5px;letter-spacing:.4px;line-height:1.25}
 .cb h3{font-size:13.5px;line-height:1.2;letter-spacing:-.2px}
 .cb p{font-size:11.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 .tm{font-size:10.5px;line-height:1.3}.ft{margin-top:6px}.go{display:none}.pr{font-size:12px;padding:3px 9px}
}

["Parque y Mirador Laikakota",1,"Miraflores",-16.5031,-68.1195,"🌲",0,20,["Parque con senderos y vista hacia el sur de la ciudad.","Park with trails and views toward the south of the city."],["Sube por sus senderos y escalinatas hasta el mirador, haz un picnic en las áreas verdes y mira la ciudad hacia la zona sur.","Climb its paths and stairways to the lookout, picnic on the green areas and look out over the city toward the south."]],
["Teleférico Línea Roja",1,"Centro · El Alto",-16.4960,-68.1450,"🚠",6,12,["La ciudad vista desde el aire, con pasaje económico.","The city seen from the air, with a low fare."],["Vuela sobre La Paz hasta El Alto con vistas al Illimani; la ida cuesta unos Bs 3 y hay tarifa rebajada para estudiantes con credencial.","Glide over La Paz to El Alto with views of Illimani; a ride is about Bs 3, with a reduced fare for students with ID."]],
["Calle Jaén",2,"Centro histórico",-16.4950,-68.1355,"🏘️",0,25,["Calle colonial empedrada con museos y cafés.","Cobbled colonial street with museums and cafés."],["Recorre la calle empedrada, entra a sus pequeños museos, mira artesanías y haz una pausa en un café o peña.","Walk the cobbled street, pop into its small museums, browse crafts and pause at a café or peña."]],
["Mercado de las Brujas",2,"Calle Linares",-16.4975,-68.1390,"🔮",0,40,["Artesanías, amuletos y tradiciones paceñas.","Crafts, amulets and La Paz traditions."],["Conoce hierbas, amuletos y ofrendas andinas, compra artesanías y souvenirs; pide permiso antes de fotografiar a las vendedoras.","Discover Andean herbs, amulets and offerings, buy crafts and souvenirs; ask permission before photographing vendors."]],
["Museo Nacional de Arte",2,"Plaza Murillo",-16.4953,-68.1336,"🖼️",15,40,["Arte boliviano en un palacio colonial.","Bolivian art in a colonial palace."],["Recorre salas de arte colonial, republicano y contemporáneo dentro de un palacio del siglo XVIII y ve las exposiciones temporales.","Tour colonial, republican and contemporary art rooms in an 18th-century palace and catch the temporary exhibitions."]],
["Museo Costumbrista",2,"Plaza Riosinho",-16.4951,-68.1366,"🎎",8,20,["Escenas y maquetas de la vida tradicional de La Paz.","Scenes and models of traditional La Paz life."],["Mira maquetas y figuras que cuentan la historia de la ciudad y sus personajes tradicionales; visita corta, perfecta con la Calle Jaén.","See models and figures telling the city's history and traditional characters; a short visit, ideal with Calle Jaén."]],
["Teatro Municipal",2,"Av. 16 de Julio",-16.4980,-68.1350,"🎭",0,80,["Teatro histórico con cartelera de música y danza.","Historic theater with music and dance programming."],["Revisa la cartelera de conciertos, danza y teatro; algunas funciones son gratuitas o muy económicas. Compra entradas con anticipación.","Check the concert, dance and theater listings; some shows are free or very cheap. Buy tickets in advance."]],
["Jardín Japonés",2,"Zona sur",-16.5394,-68.0802,"🎋",0,20,["Paseo contemplativo; confirma si está abierto al público.","Contemplative walk; confirm if it's open to the public."],["Pasea entre estanques y vegetación de estilo japonés para un momento de calma; llama o consulta antes porque el acceso puede variar.","Walk among Japanese-style ponds and plants for a calm moment; call ahead since access may vary."]],
["Valle de la Luna",3,"Mallasa",-16.5697,-68.0903,"🏜️",20,40,["Formaciones erosionadas con senderos señalizados.","Eroded formations with marked trails."],["Sigue el sendero corto entre agujas de arcilla y arena, toma fotos y aprende de su formación; lleva sombrero y agua, sombra hay poca.","Follow the short trail among clay and sand spires, take photos and learn how it formed; bring a hat and water, there's little shade."]],
["Valle de las Ánimas",3,"Sur de La Paz",-16.5878,-68.0775,"🏔️",0,25,["Paisaje de cañones y agujas de arena.","Landscape of canyons and sand spires."],["Camina entre cañones y torres de roca y haz fotografías de paisaje; los senderos son irregulares, usa zapatos con buen agarre y ve en grupo.","Walk among canyons and rock towers and shoot landscapes; trails are uneven, wear shoes with good grip and go in a group."]],
["Jardín Botánico Cota Cota",3,"Cota Cota",-16.5410,-68.0710,"🌺",8,20,["Plantas y senderos tranquilos en la zona sur.","Plants and calm trails in the south."],["Recorre colecciones de plantas andinas y valle, aprende sobre flora local y descansa en un entorno muy tranquilo.","Tour Andean and valley plant collections, learn about local flora and rest in a very calm setting."]],
["Zoológico Vesty Pakos",3,"Mallasa",-16.5675,-68.0860,"🦙",15,30,["Fauna boliviana en un entorno natural.","Bolivian wildlife in a natural setting."],["Conoce animales de Bolivia como cóndores, llamas y felinos; buen plan familiar de medio día. Revisa horarios antes de ir.","Meet Bolivian animals such as condors, llamas and wild cats; a good half-day family plan. Check hours before going."]],
["Mallasa, campo y almuerzo",3,"Mallasa",-16.5690,-68.0840,"🍲",30,80,["Aire fresco y comida típica a las afueras.","Fresh air and typical food on the outskirts."],["Disfruta aire libre y un almuerzo típico (plato paceño, trucha, sopas) en los restaurantes de la zona; combínalo con el Valle de la Luna.","Enjoy the outdoors and a typical lunch (plato paceño, trout, soups) at local restaurants; pair it with the Valle de la Luna."]],
["Estadio Hernando Siles",4,"Miraflores",-16.5042,-68.1189,"🏟️",0,100,["El estadio más famoso del país, para partidos y eventos.","The country's most famous stadium, for matches and events."],["Asiste a un partido o concierto; el precio varía mucho según el evento y la ubicación. Revisa el calendario y compra entradas oficiales.","Attend a match or concert; price varies greatly by event and seat. Check the calendar and buy official tickets."]],
["Coliseo Julio Borelli",4,"Miraflores",-16.5053,-68.1207,"🏀",0,40,["Coliseo para básquet, voley y espectáculos.","Arena for basketball, volleyball and shows."],["Mira partidos de básquet o vóley y otros espectáculos; consulta la programación y el precio de cada evento.","Watch basketball or volleyball games and other shows; check the schedule and each event's price."]],
["Canchas de Obrajes",4,"Obrajes",-16.5350,-68.0875,"⚽",15,50,["Zona para alquilar cancha y jugar con amigos.","Area to rent a court and play with friends."],["Alquila una cancha por hora para fútbol o fútbol sala y divide el costo entre el grupo; reserva con anticipación, sobre todo viernes y fines de semana.","Rent a court by the hour for football or futsal and split the cost; book ahead, especially Fridays and weekends."]],
["Canchas de Calacoto",4,"Calacoto",-16.5380,-68.0800,"🏐",15,50,["Espacios deportivos en la zona sur.","Sports venues in the south."],["Juega fútbol, vóley o básquet en canchas de alquiler; pregunta por tarifas por hora y por iluminación nocturna.","Play football, volleyball or basketball on rental courts; ask about hourly rates and night lighting."]],
["Cafés de Sopocachi",5,"Sopocachi",-16.5128,-68.1272,"☕",18,45,["Cafés para conversar, estudiar o leer.","Cafés to chat, study or read."],["Pide un café de especialidad o un té, lleva tu laptop o un libro y quédate un rato en los locales de ambiente tranquilo.","Order a specialty coffee or tea, bring a laptop or book and linger at the relaxed venues."]],
["Cafés de la 16 de Julio",5,"El Prado",-16.5000,-68.1300,"🥐",18,50,["Café y pasteles en pleno Prado.","Coffee and pastries right on the Prado."],["Toma café con pastelería clásica y observa el movimiento del Prado paceño; buen punto antes o después de un paseo por el centro.","Have coffee with classic pastries and watch the Prado bustle; a good stop before or after a downtown stroll."]],
["Cafés de Calacoto",5,"Calacoto",-16.5365,-68.0830,"🍰",20,55,["Cafeterías de ambiente tranquilo en la zona sur.","Quiet cafés in the south."],["Disfruta postres, brunch y café en cafeterías de la zona sur; precios algo más altos que en el centro.","Enjoy desserts, brunch and coffee in south-zone cafés; prices run a bit higher than downtown."]],
["Cafés de San Miguel",5,"San Miguel",-16.5400,-68.0840,"🧋",20,55,["Bebidas, postres y puntos de encuentro.","Drinks, desserts and meeting spots."],["Elige entre bebidas frías, postres y meriendas en un barrio muy concurrido; ideal para encontrarse con amigos.","Pick from cold drinks, desserts and snacks in a lively neighborhood; ideal for meeting friends."]]
].map((r,i)=>{const[n,c,z,la,ln,e,a,b,d,w]=r;return{id:i,n,c,z,e,a,b,d,w,la,ln}});
let ORG=null,LS=null;
function calc(){const o=ORG||MONO,R=Math.PI/180;for(const p of P){
 const k=(p.la-o[0])*R,m=(p.ln-o[1])*R,h=Math.sin(k/2)**2+Math.cos(o[0]*R)*Math.cos(p.la*R)*Math.sin(m/2)**2;
 p.km=12742*Math.asin(Math.sqrt(h));const rd=p.km*1.3,legs=1+(rd>=5)+(rd>=12);p.walk=rd<1.5;
 p.tr=p.walk?[0,7]:[legs*6,Math.ceil(legs*7)];const mn=p.walk?rd*13+2:rd*3.2+6;p.t=[Math.round(mn*.8),Math.round(mn*1.3)];
 p.min=p.a+p.tr[0];p.max=p.b+p.tr[1]}}
const tm=p=>`${p.walk?"🚶":"🚌"} ≈ ${p.t[0]}–${p.t[1]} min ${t(p.walk?"onfoot":"bytr")}`;
function locate(){if(!navigator.geolocation){LS="locerr";apply();return}LS="locw";apply();
 navigator.geolocation.getCurrentPosition(p=>{ORG=[p.coords.latitude,p.coords.longitude];calc();LS=Math.min(...P.map(x=>x.km))>30?"locfar":"locok";apply()},()=>{ORG=null;calc();LS="locerr";apply()},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const dk=p=>p.km<.15?t(ORG?"nearu":"near"):p.km<1?`≈ ${Math.round(p.km*1000)} m`:`≈ ${p.km.toFixed(1)} km`;
const Q=p=>encodeURIComponent(p.n+", La Paz, Bolivia");
function chips(){$("#chips").innerHTML=[`<button class="chip${cat<0?" on":""}" data-c="-1">${t("all")} (${P.length})</button>`,...C.map((x,i)=>`<button class="chip${cat===i?" on":""}" data-c="${i}">${x.e} ${g(x.n)}</button>`)].join("")}
function plan(){const el=$("#plan");if(!budV){el.hidden=true;return}
 const u=new Set(),ch=[];let tot=0;for(const p of [...P].sort((a,b)=>a.km-b.km))if(ch.length<3&&!u.has(p.c)&&tot+p.min<=budV){ch.push(p);u.add(p.c);tot+=p.min}
 el.hidden=false;el.innerHTML=ch.length?`<b>${t("plan")}</b> ${ch.map(p=>`<a data-id="${p.id}">${p.e} ${E(p.n)}</a>`).join(" + ")} · ${t("from")} <b>Bs ${tot}</b>`:`<b>${t("plan")}</b> ${t("noplan")}`}
function list(){const q=N(qq);
 const L2=P.filter(p=>(cat<0||p.c===cat)&&(!budV||p.min<=budV)&&N([p.n,p.z,...p.d,...p.w,...C[p.c].n].join(" ")).includes(q))
 .sort((a,b)=>sortV==="p"?a.min-b.min:sortV==="n"?a.n.localeCompare(b.n,"es"):a.km-b.km);
 $("#count").textContent=`${L2.length} ${t(L2.length==1?"pl":"pls")}`;plan();
 $("#grid").innerHTML=L2.length?L2.map(p=>{const c=C[p.c];return`<button class="card" data-id="${p.id}">
 <div class="top" style="background:linear-gradient(135deg,${c.c}55,${c.c}14)">${p.e}<span class="dist">📍 ${dk(p)}</span>${budV&&p.max<=budV?`<span class="fit">${t("fit")}</span>`:""}</div>
 <div class="cb"><small style="color:${c.c}">${g(c.n)} · ${E(p.z)}</small><h3>${E(p.n)}</h3><p>${E(g(p.d))}</p><span class="tm">${tm(p)}</span>
 <div class="ft"><span class="pr">Bs ${p.min}–${p.max}</span><span class="go">${t("more")}</span></div></div></button>`}).join(""):
 `<div class="empty"><b>${t("et")}</b><br>${t("es")}</div>`}
function open(id){const p=P[id];if(!p)return;cur=id;const c=C[p.c];
 $("#mc").innerHTML=`<div class="mh" style="background:linear-gradient(135deg,${c.c}66,${c.c}18)">${p.e}</div><div class="mb">
 <small style="color:${c.c}">${g(c.n)} · ${E(p.z)}</small><h2>${E(p.n)}</h2><p>${E(g(p.d))}</p>
 <p style="margin-top:8px">📍 ${dk(p)}${p.km<.15?"":" "+t(ORG?"ofu":"ofm")}<br>${tm(p)}</p>
 <h4>${t("what")}</h4><div class="wh">${E(g(p.w))}</div><ul style="margin-top:10px">${g(c.a).map(a=>`<li>${a}</li>`).join("")}</ul>
 <div class="bud"><div class="bt"><span>${t("bpp")}</span><b>Bs ${p.min}–${p.max}</b></div>
 <div class="it"><span>${t(ORG?"tru":"tr")}</span><b>Bs ${p.tr[0]}–${p.tr[1]}</b></div>
 <div class="it"><span>${t("en")}</span><b>${p.b?`Bs ${p.a}–${p.b}`:t("free")}</b></div></div>
 <div class="tip">💡 ${g(c.t)}</div>
 <div class="ac"><a class="bn p" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${ORG?ORG.join(","):encodeURIComponent("Monoblock UMSA, La Paz, Bolivia")}&destination=${Q(p)}">${t(ORG?"howu":"how")}</a>
 <a class="bn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${Q(p)}">${t("map")}</a>
 <a class="bn" target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${Q(p)}">${t("ph2")}</a></div></div>`;
 $("#md").hidden=false;document.body.style.overflow="hidden";history.replaceState(null,"","#lugar-"+id)}
function close(){cur=null;$("#md").hidden=true;document.body.style.overflow="";history.replaceState(null,"",location.pathname+location.search)}
function apply(){document.documentElement.lang=L;document.title="KUNTUR NEST | "+t("tt");
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("#q").placeholder=t("ph");$("#pill").textContent=t("pill")+(ORG?t("orgu"):"Monoblock UMSA");$("#orgn").textContent=ORG?t("orgu"):"Monoblock";$("#loc").textContent=t(ORG?"locb2":"locb");$("#locs").hidden=!LS;$("#locs").textContent=LS?t(LS):"";
 $("#sort").innerHTML=[["d","s1"],["p","s2"],["n","s3"]].map(([v,k])=>`<option value="${v}"${v===sortV?" selected":""}>${t(k)}</option>`).join("");
 $("#bud").innerHTML=[0,30,60,100,200,400].map(v=>`<option value="${v}"${v===budV?" selected":""}>${v?t("bu")+" "+v:t("b0")}</option>`).join("");
 document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 chips();list();if(cur!==null)open(cur)}
$("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=+b.dataset.c;chips();list()}};
$("#grid").onclick=e=>{const b=e.target.closest("[data-id]");if(b)open(+b.dataset.id)};
$("#plan").onclick=e=>{const b=e.target.closest("[data-id]");if(b)open(+b.dataset.id)};
$("#q").oninput=e=>{qq=e.target.value.trim();list()};$("#sort").onchange=e=>{sortV=e.target.value;list()};$("#bud").onchange=e=>{budV=+e.target.value;list()};
$("#loc").onclick=()=>{if(ORG){ORG=null;LS=null;calc();apply()}else locate()};
$("#um").onclick=e=>{e.stopPropagation();$("#umm").hidden=!$("#umm").hidden};
$("#umm").onclick=e=>{e.stopPropagation();const b=e.target.closest("[data-l]");if(b){L=b.dataset.l;try{localStorage.setItem("kn-lang",L)}catch(x){}apply()}};
document.addEventListener("click",()=>$("#umm").hidden=true);
$("#cl").onclick=close;$("#md").onclick=e=>{if(e.target.id==="md")close()};
document.onkeydown=e=>{if(e.key==="Escape"){close();$("#umm").hidden=true}};
calc();apply();locate();const m=location.hash.match(/lugar-(\d+)/);if(m)open(+m[1]);
</script></body></html>
